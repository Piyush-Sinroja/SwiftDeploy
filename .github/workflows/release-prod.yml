# =============================================================
# Release Prod Workflow — Production Upload
# =============================================================
# Two triggers:
#
# 1. AUTOMATIC — Release candidate tag (v*.*.*-rc*)
#    Release manager creates tag after QA approves Stage build:
#      git tag v1.1.0-rc1
#      git push origin v1.1.0-rc1
#    CI builds Prod IPA and uploads to App Store Connect.
#    QA smoke tests this prod build on internal TestFlight.
#    If bug found → fix on release branch → new Stage build
#                 → QA approves → new rc tag → new Prod build
#
# 2. MANUAL — workflow_dispatch
#    Release manager triggers from GitHub Actions UI.
#    Same result as tag trigger.
#    Use when you prefer not to create rc tags.
#
# After QA approves Prod build:
#   Run submit-review.yml manually to submit to Apple review.
#
# Build type: Prod Release
# Destination: Prod App Store Connect (submit_for_review: false)
# =============================================================

name: Release — Prod App Store Connect

on:
  # Trigger 1: Release candidate tag
  # Matches: v1.0.0-rc1, v1.1.0-rc2, v2.0.0-rc1 etc.
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+'

  # Trigger 2: Manual trigger from GitHub Actions UI
  # Go to: GitHub repo → Actions → Release Prod → Run workflow
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual prod build (e.g. QA approved stage build 35)'
        required: true
        type: string
      environment:
        description: 'Confirm environment'
        required: true
        type: choice
        options:
          - production
        default: production

jobs:
  # ── Log manual trigger reason ─────────────────────────────
  # Only runs for workflow_dispatch triggers
  log-trigger:
    name: Log Trigger Info
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Log
        run: |
          echo "Manual prod build triggered"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Branch/SHA: ${{ github.sha }}"

  # ── Build and Upload Prod ─────────────────────────────────
  prod-build:
    name: Upload to Prod App Store Connect
    uses: ./.github/workflows/_reusable-build.yml
    with:
      lane: release     # builds Prod Release, uploads to App Store Connect (no submit)
    secrets:
      APPLE_ID:                      ${{ secrets.APPLE_ID }}
      TEAM_ID:                       ${{ secrets.TEAM_ID }}
      ITC_TEAM_ID:                   ${{ secrets.ITC_TEAM_ID }}
      APP_IDENTIFIER_PROD:           ${{ secrets.APP_IDENTIFIER_PROD }}
      APP_IDENTIFIER_QA:             ${{ secrets.APP_IDENTIFIER_QA }}
      APP_IDENTIFIER_DEV:            ${{ secrets.APP_IDENTIFIER_DEV }}
      ASC_KEY_ID:                    ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:                 ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT:               ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_GIT_URL:                 ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD:                ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      SLACK_WEBHOOK_URL:             ${{ secrets.SLACK_WEBHOOK_URL }}
