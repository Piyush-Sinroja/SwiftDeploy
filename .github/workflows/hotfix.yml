# =============================================================
# Hotfix Workflow — Live App Emergency Fix
# =============================================================
# Triggers on push to main (after hotfix/* PR is merged).
# main only receives direct pushes for hotfixes.
# Regular releases merge to main AFTER App Store approval
# via the release-prod.yml workflow (not this one).
#
# Hotfix flow:
#   1. Bug found in live App Store app
#   2. git checkout -b hotfix/1.1.1 from main
#   3. Fix + bump_patch (1.1.0 → 1.1.1)
#   4. PR: hotfix/1.1.1 → main
#   5. Merge → this workflow triggers → prod build uploaded
#   6. QA smoke tests → submit_for_review → Apple review
#
# DEBUGGING:
#   build-logs-release-*  → compile/signing errors
#   fastlane-report-*     → which step failed and why
# =============================================================

name: Hotfix — Prod App Store Connect

on:
  push:
    branches:
      - main

  # Manual trigger with cache control
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Skip all caches for a clean build'
        type: boolean
        default: false

# No cancel-in-progress — hotfixes are critical
# Every push must complete even if another arrives

jobs:
  hotfix-build:
    name: Upload Hotfix to Prod App Store Connect
    uses: ./.github/workflows/_reusable-build.yml
    with:
      lane: upload_appstore_prod
      clear_cache: ${{ github.event.inputs.clear_cache == 'true' }}
    secrets:
      APPLE_ID:                      ${{ secrets.APPLE_ID }}
      TEAM_ID:                       ${{ secrets.TEAM_ID }}
      ITC_TEAM_ID:                   ${{ secrets.ITC_TEAM_ID }}
      APP_IDENTIFIER_PROD:           ${{ secrets.APP_IDENTIFIER_PROD }}
      APP_IDENTIFIER_QA:             ${{ secrets.APP_IDENTIFIER_QA }}
      APP_IDENTIFIER_DEV:            ${{ secrets.APP_IDENTIFIER_DEV }}
      ASC_KEY_ID:                    ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:                 ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT:               ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_GIT_URL:                 ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD:                ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      SLACK_WEBHOOK_URL:             ${{ secrets.SLACK_WEBHOOK_URL }}
      BETA_CONTACT_EMAIL:            ${{ secrets.BETA_CONTACT_EMAIL }}
      BETA_CONTACT_FIRST_NAME:       ${{ secrets.BETA_CONTACT_FIRST_NAME }}
      BETA_CONTACT_LAST_NAME:        ${{ secrets.BETA_CONTACT_LAST_NAME }}
      BETA_CONTACT_PHONE:            ${{ secrets.BETA_CONTACT_PHONE }}
