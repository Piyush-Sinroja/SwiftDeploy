# =============================================================
# Hotfix Workflow — Live App Emergency Fix
# =============================================================
# MANUAL ONLY — never auto-triggers.
# Tech lead manually triggers after hotfix/* is merged to main.
#
# Hotfix flow:
#   1. Bug found in live App Store app
#   2. git checkout -b hotfix/1.0.1 from main
#   3. Fix + bump version (1.0.0 → 1.0.1)
#   4. PR: hotfix/1.0.1 → main (pr-checks run)
#   5. Merge to main
#   6. Tech lead manually triggers this workflow
#   7. QA smoke tests on TestFlight
#   8. Submit to App Store Connect
#   9. Back-merge hotfix → dev
#
# DEBUGGING:
#   build-logs-release-*  → compile/signing errors
#   fastlane-report-*     → which step failed and why
# =============================================================

name: Hotfix — Prod App Store Connect

on:
  # Manual only — tech lead triggers after hotfix merged to main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for hotfix build (e.g. login crash fix)'
        required: true
        type: string
      clear_cache:
        description: 'Skip all caches for a clean build'
        type: boolean
        default: false

# No cancel-in-progress — hotfixes are critical
# Every push must complete even if another arrives

jobs:
  hotfix-build:
    name: Upload Hotfix to Prod App Store Connect
    uses: ./.github/workflows/_reusable-build.yml
    with:
      lane: upload_appstore_prod
      clear_cache: ${{ github.event.inputs.clear_cache == 'true' }}
    secrets:
      APPLE_ID:                      ${{ secrets.APPLE_ID }}
      TEAM_ID:                       ${{ secrets.TEAM_ID }}
      ITC_TEAM_ID:                   ${{ secrets.ITC_TEAM_ID }}
      ASC_KEY_ID:                    ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID:                 ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT:               ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_GIT_URL:                 ${{ secrets.MATCH_GIT_URL }}
      MATCH_PASSWORD:                ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      SLACK_WEBHOOK_URL:             ${{ secrets.SLACK_WEBHOOK_URL }}
      BETA_CONTACT_EMAIL:            ${{ secrets.BETA_CONTACT_EMAIL }}
      BETA_CONTACT_PHONE:            ${{ secrets.BETA_CONTACT_PHONE }}
