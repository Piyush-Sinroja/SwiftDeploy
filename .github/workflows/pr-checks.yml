# =============================================================
# PR Checks Workflow
# =============================================================
# Triggers on every PR opened/updated targeting develop or main.
# Three jobs run in this order:
#   1. lint      → fast fail, no point running tests if lint fails
#   2. unit-tests → parallel with ui-tests after lint passes
#   3. ui-tests   → parallel with unit-tests after lint passes
#
# PR cannot be merged unless ALL jobs pass.
# No code signing needed here — just build and test.
# =============================================================

name: PR Checks

on:
  pull_request:
    branches:
      - develop       # feature/* → develop
      - main          # release/* → main (hotfix PRs)
    types:
      - opened        # new PR
      - synchronize   # new commit pushed to PR
      - reopened      # PR reopened after close

# Cancel in-progress runs for the same PR
# Prevents wasting CI minutes when developer pushes new commit
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Job 1: SwiftLint ──────────────────────────────────────
  # Runs first. Unit and UI tests only start if this passes.
  # Fast — usually done in under 2 minutes.
  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run SwiftLint
        run: bundle exec fastlane lint

  # ── Job 2: Unit Tests ─────────────────────────────────────
  # Runs after lint passes. Parallel with ui-tests.
  # Tests only SwiftDeployTests target.
  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    needs: lint       # wait for lint to pass first

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # Cache speeds up incremental compilation on repeat runs
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-unit-${{ hashFiles('**/*.swift', '**/*.xcconfig') }}
          restore-keys: |
            derived-${{ runner.os }}-unit-
            derived-${{ runner.os }}-

      - name: Run Unit Tests
        run: bundle exec fastlane test_unit
        env:
          APP_IDENTIFIER_PROD: ${{ secrets.APP_IDENTIFIER_PROD }}
          APP_IDENTIFIER_QA:   ${{ secrets.APP_IDENTIFIER_QA }}
          APP_IDENTIFIER_DEV:  ${{ secrets.APP_IDENTIFIER_DEV }}
          CI:                  true

      # Upload test results for review in GitHub Actions UI
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()    # upload even if tests fail
        with:
          name: unit-test-results
          path: fastlane/test_output/unit_tests.xml
          retention-days: 7

  # ── Job 3: UI Tests ───────────────────────────────────────
  # Runs after lint passes. Parallel with unit-tests.
  # Tests only SwiftDeployUITests target.
  # Slower than unit tests — requires full simulator boot.
  ui-tests:
    name: UI Tests
    runs-on: macos-15
    needs: lint       # wait for lint to pass first

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.3.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-${{ runner.os }}-ui-${{ hashFiles('**/*.swift', '**/*.xcconfig') }}
          restore-keys: |
            derived-${{ runner.os }}-ui-
            derived-${{ runner.os }}-

      - name: Run UI Tests
        run: bundle exec fastlane test_ui
        env:
          APP_IDENTIFIER_PROD: ${{ secrets.APP_IDENTIFIER_PROD }}
          APP_IDENTIFIER_QA:   ${{ secrets.APP_IDENTIFIER_QA }}
          APP_IDENTIFIER_DEV:  ${{ secrets.APP_IDENTIFIER_DEV }}
          CI:                  true

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: fastlane/test_output/ui_tests.xml
          retention-days: 7
