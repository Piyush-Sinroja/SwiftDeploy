# =============================================================
# PR Checks Workflow
# =============================================================
# Triggers on every PR to dev or main.
# Jobs run in this order:
#   lint (fast fail)
#   unit-tests + ui-tests (parallel after lint)
#
# CACHE BUSTING:
#   Add ?clear_cache=true to workflow_dispatch trigger
#   Or increment CACHE_VERSION below
#
# DEBUGGING FAILED TESTS:
#   Artifacts section of failed run:
#   test-results-unit-*  → JUnit XML → which tests failed
#   test-results-ui-*    → JUnit XML → which UI tests failed
#   xcresult-unit-*      → Xcode bundle → stack traces + screenshots
#   build-logs-*         → compile errors if build itself failed
# =============================================================

name: PR Checks

on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize, reopened]

  # Allow manual trigger with cache control
  workflow_dispatch:
    inputs:
      clear_cache:
        description: 'Skip all caches for a clean build'
        type: boolean
        default: false

# Cancel in-progress run when new commit is pushed to same PR
concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CACHE_VERSION: v1    # Increment to bust all caches permanently

jobs:
  # ── Job 1: SwiftLint ─────────────────────────────────────────
  # Runs first. Tests only start after lint passes.
  # Fail fast — no point running tests if code style is wrong.
  lint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: bundle exec fastlane lint

      - name: Upload SwiftLint Report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: swiftlint-report-${{ github.run_number }}
          path: fastlane/report.xml
          retention-days: 3
          if-no-files-found: ignore

  # ── Job 2: Unit Tests ─────────────────────────────────────────
  # Runs after lint. Parallel with UI tests.
  unit-tests:
    name: Unit Tests
    runs-on: macos-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.3.app"

      - name: Check Installed iOS SDKs
        run: xcodebuild -showsdks

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # SPM cache for unit tests
      - name: Cache SPM
        if: ${{ github.event.inputs.clear_cache != 'true' && hashFiles('**/Package.resolved') != '' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ env.CACHE_VERSION }}-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-spm-${{ runner.os }}-

      # DerivedData cache — separate key for unit tests
      - name: Cache DerivedData
        if: ${{ github.event.inputs.clear_cache != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ env.CACHE_VERSION }}-derived-${{ runner.os }}-unit-${{ hashFiles('**/*.swift', '**/*.xcconfig') }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-derived-${{ runner.os }}-unit-
            ${{ env.CACHE_VERSION }}-derived-${{ runner.os }}-

      - name: Run Unit Tests
        run: bundle exec fastlane test_unit
        env:
          CI: true
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 5

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-unit-${{ github.run_number }}
          path: fastlane/test_output/unit_tests.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload xcresult on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult-unit-${{ github.run_number }}
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            fastlane/test_output/*.xcresult
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Build Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-unit-${{ github.run_number }}
          path: ~/Library/Logs/scan/
          retention-days: 3
          if-no-files-found: ignore

  # ── Job 3: UI Tests ───────────────────────────────────────────
  # Runs after lint. Parallel with unit tests.
  # Slower — requires full simulator boot.
  ui-tests:
    name: UI Tests
    runs-on: macos-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.3"

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.3.app"

      - name: Check Installed iOS SDKs
        run: xcodebuild -showsdks

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Cache SPM
        if: ${{ github.event.inputs.clear_cache != 'true' && hashFiles('**/Package.resolved') != '' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages/checkouts
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ env.CACHE_VERSION }}-spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-spm-${{ runner.os }}-

      # Separate DerivedData cache key for UI tests
      - name: Cache DerivedData
        if: ${{ github.event.inputs.clear_cache != 'true' }}
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ env.CACHE_VERSION }}-derived-${{ runner.os }}-ui-${{ hashFiles('**/*.swift', '**/*.xcconfig') }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-derived-${{ runner.os }}-ui-
            ${{ env.CACHE_VERSION }}-derived-${{ runner.os }}-

      - name: Run UI Tests
        run: bundle exec fastlane test_ui
        env:
          CI: true
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 5

      - name: Upload UI Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-ui-${{ github.run_number }}
          path: fastlane/test_output/ui_tests.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload xcresult on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcresult-ui-${{ github.run_number }}
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
            fastlane/test_output/*.xcresult
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Build Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs-ui-${{ github.run_number }}
          path: ~/Library/Logs/scan/
          retention-days: 3
          if-no-files-found: ignore
