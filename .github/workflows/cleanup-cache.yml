# =============================================================
# Cache Cleanup Workflow
# =============================================================
# Two triggers:
#
# 1. Branch deleted — removes caches for that branch immediately.
#    Prevents stale caches from merged/deleted feature branches
#    from consuming the 10 GB GitHub cache storage limit.
#
# 2. Weekly schedule (Sunday midnight) — removes caches older
#    than 7 days that weren't cleaned up by branch deletion.
#    Handles tag caches (rc1, rc2 etc.) and orphaned caches.
#
# Runs on ubuntu-latest — no Xcode needed, just GitHub API calls.
# =============================================================

name: Cleanup Cache

permissions:
  actions: write  # required to delete caches via GitHub API

on:
  # Trigger 1 — branch or tag deleted
  delete:

  # Trigger 2 — every Sunday at midnight UTC
  schedule:
    - cron: '0 0 * * 0'

  # Manual trigger — run anytime cache needs cleanup
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Delete caches older than N days'
        required: false
        type: number
        default: 7

jobs:
  # ── Job 1: Delete caches for deleted branch ──────────────────
  # Only runs on branch/tag delete event
  cleanup-branch-cache:
    name: Delete Branch Cache
    runs-on: ubuntu-latest
    if: github.event_name == 'delete'

    steps:
      - name: Delete caches for deleted branch
        uses: actions/github-script@v7
        with:
          script: |
            const ref = context.ref;
            const branchName = ref.replace('refs/heads/', '').replace('refs/tags/', '');

            console.log(`🗑️  Cleaning caches for deleted ref: ${branchName}`);

            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: ref,
              per_page: 100
            });

            if (caches.data.actions_caches.length === 0) {
              console.log('No caches found for this branch.');
              return;
            }

            let deleted = 0;
            for (const cache of caches.data.actions_caches) {
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id,
              });
              console.log(`✅ Deleted: ${cache.key} (${(cache.size_in_bytes / 1024 / 1024).toFixed(0)} MB)`);
              deleted++;
            }

            console.log(`\n🎉 Cleaned ${deleted} cache(s) for branch: ${branchName}`);

  # ── Job 2: Weekly cleanup of old caches ──────────────────────
  # Runs on schedule and manual dispatch
  cleanup-old-caches:
    name: Delete Old Caches
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Delete caches older than N days
        uses: actions/github-script@v7
        with:
          script: |
            const maxAgeDays = ${{ inputs.max_age_days || 7 }};
            const maxAgeMs   = maxAgeDays * 24 * 60 * 60 * 1000;
            const now        = Date.now();

            console.log(`🔍 Finding caches older than ${maxAgeDays} days...`);

            let page    = 1;
            let deleted = 0;
            let kept    = 0;
            let totalDeleted = 0;

            while (true) {
              const caches = await github.rest.actions.getActionsCacheList({
                owner:    context.repo.owner,
                repo:     context.repo.repo,
                per_page: 100,
                page:     page
              });

              if (caches.data.actions_caches.length === 0) break;

              for (const cache of caches.data.actions_caches) {
                const lastUsed = new Date(cache.last_accessed_at).getTime();
                const ageMs    = now - lastUsed;
                const ageDays  = (ageMs / (1000 * 60 * 60 * 24)).toFixed(1);
                const sizeMB   = (cache.size_in_bytes / 1024 / 1024).toFixed(0);

                if (ageMs > maxAgeMs) {
                  await github.rest.actions.deleteActionsCacheById({
                    owner:    context.repo.owner,
                    repo:     context.repo.repo,
                    cache_id: cache.id,
                  });
                  console.log(`✅ Deleted (${ageDays}d old, ${sizeMB} MB): ${cache.key}`);
                  totalDeleted += cache.size_in_bytes;
                  deleted++;
                } else {
                  console.log(`⏭️  Kept   (${ageDays}d old, ${sizeMB} MB): ${cache.key}`);
                  kept++;
                }
              }

              page++;
            }

            const totalMB = (totalDeleted / 1024 / 1024).toFixed(0);
            console.log(`\n📊 Summary:`);
            console.log(`   Deleted: ${deleted} caches (${totalMB} MB freed)`);
            console.log(`   Kept:    ${kept} caches`);
